name: Daily Commit

on:
  schedule:
    # Runs every day at 12:00 AM UTC (midnight)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Create and push commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Update a timestamp file
          echo "Last updated: $(date)" > DAILY_COMMIT.txt
          
          git add DAILY_COMMIT.txt
          git commit -m "chore: daily commit to maintain streak - $(date +'%Y-%m-%d')" || echo "No changes to commit"
          
          git push

